<!DOCTYPE html>
<html>
    <head>
        <style>
         .container{
            display: grid;
            place-items: center;
            height: 100vh;
         }
         .login-box{
            display: flex;
            flex-direction: column;
         }
         .button{
            background-color: brown;
            transition: 3s;
         }  
         .button:hover{
            background-color:aquamarine;
            color:white;
         }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="login-box">
                <h1> Login </h1>
                <input type="text" placeholder="username">
                <input type="password" placeholder="password">
                <button class="button"> Login </button>
            </div>
        </div>
    </body>
</html>
