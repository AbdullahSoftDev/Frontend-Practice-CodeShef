<!--
Task - Build a User Profile Form
Goal: Combine what you've learned to build a complete and organized user profile form. You will use different input types to collect various kinds of information.

Instructions

Inside the <form>, add the following input fields:
An input for a person's full name. This should be a type of "text". Give it a name and placeholder.
An input for an email address. This should be a type of "email". Give it a name and placeholder.
An input for a password. This should be a type of "password". Give it a name and placeholder.
An input for confirming the password. This should also be a type of "password". Make sure it has a different name than the first password field (e.g., name="confirm-password").
Finally, add a submit button with a type of "submit". Use the value attribute to change the text on the button to "Create Profile".
-->

<!DOCTYPE html>
<html>
<head>
    <title>User Profile Form</title>
</head>
<body>
    <h2>Create Your Profile</h2>
    <form>
        <label>Enter You Full Name: </label><br>
        <input type="text" name="full-name" placeholder="Enter your full name"></input><br>
        <label>Enter Email Address: </label><br>
        <input type="email" name="email" placeholder="Enter your email address"></input><br>
        <label>Create a New Password: </label><br>
        <input type="password" name="password" placeholder="Create a password"></input><br>
        <label>Confirm Your New Password </label><br>
        <input type="password" name="confirm-password" placeholder="Confirm your password"></input><br><br>
        <input type="submit" value="Create Profile"> Create Profile </input>
    </form>
</body>
</html>
