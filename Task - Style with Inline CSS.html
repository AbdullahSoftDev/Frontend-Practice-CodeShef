<!--/*Task - Style with Inline CSS
Goal: Your goal is to use the provided CSS code to style two HTML elements. The key is to add a style attribute directly inside each HTML tag.

Instructions

For the <h1> heading:
Find the <h1>My Favorite Things</h1> tag.
Add the style attribute to this tag.
Use the following code inside the style attribute: color: blue; font-size: 40px;
It should look like this when you're done:
<h1 style="color: blue; font-size: 40px;">My Favorite Things</h1>
For the <p> paragraph:
Find the <p> element.
Add the style attribute to this tag.
Use the following code inside the style attribute: color: green; font-size: 18px; */
-->

<!DOCTYPE html>
<html>
<head>
    <title>Inline CSS Task</title>  
</head>
<body>

    <h1 style="color: blue; font-size: 40px;">My Favorite Things</h1>

    <p style="color: green; font-size: 18px;">This is a list of some of my favorite things. Let's make this page a little more colorful using CSS!</p>

    <ul>
        <li>Coding</li>
        <li>Learning</li>
        <li>Designing</li>
    </ul>

</body>
</html>
