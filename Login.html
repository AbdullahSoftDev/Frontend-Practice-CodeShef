<!DOCTYPE html>
<html>
    <head>
        <style>
         .container{
            display: grid;
            place-items: center;
            height: 100vh;
            transition: 3s;
         } 
         .login-box{
            padding: 20px;
            display: grid;
            gap: 10px;
            background-color: bisque;
            border-radius: 30px;
         }
         .login-box h1{
            text-align: center;
         }
         .button{
            background-color: brown;
            transition: 3s;
         }  
         .button:hover{
            background-color:aquamarine;
            color:white;
         }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="login-box">
                <h1> Login </h1>    
                <label>Username</label>
                <input id="username" type="text" placeholder="username" style="padding: 10px;border-radius: 20px;">
                <label>Password</label>
                <input id="password" type="password" placeholder="password" style="padding: 10px; border-radius: 20px;">
                <button id="loginBtn" class="button" style="padding: 10px; border-radius: 20px;"> Login </button>
            </div>
        </div>
        <script>
            document.getElementById("loginBtn").addEventListener("click", function () {
                if (document.getElementById("username").value === "Abdullah" && document.getElementById("password").value === "123456") {
                    alert("Login Successful!");
                    window.location.href="https://google.com"
                } else {
                    alert("Login Failed!");
                }
            });
        </script>
    </body>
</html>
